name: Repository hygiene

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reject local state and native binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run hygiene integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Inspect repository contents
        run: python3 scripts/check_repository_hygiene.py

      - name: Verify vendored source snapshots
        run: python3 scripts/verify_source_snapshots.py
