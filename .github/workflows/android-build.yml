name: Android source build

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both ABIs from source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install fixed Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Verify source snapshots and repository hygiene
        run: |
          python3 scripts/check_repository_hygiene.py
          python3 scripts/verify_source_snapshots.py
          python3 -m unittest discover -s tests -v

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :launcher-app:assembleDebug :launcher-app:assembleRelease

      - name: Run Android lint
        run: ./gradlew --no-daemon :launcher-app:lintDebug

      - name: Verify APK native libraries
        run: |
          python3 scripts/check_apk_native_libraries.py \
            launcher-app/build/outputs/apk/debug/launcher-app-debug.apk \
            launcher-app/build/outputs/apk/release/launcher-app-release-unsigned.apk

      - name: Verify 16 KB APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 \
            launcher-app/build/outputs/apk/debug/launcher-app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 \
            launcher-app/build/outputs/apk/release/launcher-app-release-unsigned.apk

      - name: Upload uncommitted build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twinquill-m0-apks
          if-no-files-found: error
          path: |
            launcher-app/build/outputs/apk/debug/launcher-app-debug.apk
            launcher-app/build/outputs/apk/release/launcher-app-release-unsigned.apk
